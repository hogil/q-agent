          - 'cell "품질 AI Agent Architecture 입구에서 등록까지 다섯 단계가 하나의 조사 코어와 승인 흐름을 공유한다. ① 입구 SPC 이벤트 Chat 질문 → ② Router 조사 도구 선택 가설 갱신 → ③ 판정 근거 조합 검증 5칙 → ④ 조치 L1~L5 L4 승인 → ⑤ 등록 승인 이력 재사용 확정 이력과 현업 피드백을 조사 규칙, 검색 코퍼스, 평가셋에 반영 1. Agent 당위성 조사 순서가 가변 직전 결과에 따라 다음 데이터와 도구가 달라진다. 데이터 형식이 혼합 Trend, 이미지, 문서, 정형 DB를 함께 판단한다. 근거가 감사 대상 결론뿐 아니라 원문, 수치, 승인 이력을 남겨야 한다. 2. 알고리즘 선택 문제 기각 채택과 이유 Trend 이상 완만한 drift 포함 고정 임계 규칙 합성 데이터 감지 + LLM 감지는 모델, 변경점 연결은 LLM 불량 이미지 미등록 패턴 포함 분류기 단독 ConvNeXt V2 + contrastive 분류와 유사 사례 검색을 함께 사용 사고 검색 번호와 전문 용어 벡터 검색 단독 meta + BM25 + embedding + rerank 키 조회 뒤 제한 범위에서 결합 검색 3. 성능: 선행 전문 모델 실측 선행 이미지 프로토타입 A 무라벨 이미지 대조 학습으로 유사 패턴을 찾고, 운영 확정은 composite map과 원본 이미지로 수행한다. noise ratio 6.20% → 0.52% 군집 ARI 0.823 → 0.860 43 class, 900 wafer 선행 실측 Trend 전문 모델 라벨이 부족한 drift, spike, level step을 합성 주입하고 복귀형 파형은 정상 학습에 포함한다. 1단 감지 + 2단 LLM 판독 Grad-CAM과 임계 sweep으로 근거와 운영 기준을 남긴다." [ref=f1e205]':
