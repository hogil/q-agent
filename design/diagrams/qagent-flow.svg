<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1540" viewBox="0 0 1180 1540">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<title>Q-Agent: Router 아래 Judge, 그 아래 Answer</title>
<desc>사용자 질문에서 사고 DB 우선 조회와 후속 Tool을 거쳐 Judge가 근거를 검토하고 Answer가 최종 답변한다. 근거 부족은 오른쪽 화살표를 따라 상단의 동일 Router로 복귀한다.</desc>
<text x="70" y="57" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="37" fill="#14243b" text-anchor="start" dominant-baseline="central">Q-Agent  품질 사고 분석 흐름</text>
<text x="70" y="108" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" fill="#63748b" text-anchor="start" dominant-baseline="central">Router → Judge → Answer 순서 고정</text>
<rect x="70" y="155" width="740" height="95" rx="18" fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5"/>
<text x="440" y="188" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="30" fill="#223047" text-anchor="middle" dominant-baseline="central">사용자 질문 / 분석 의뢰</text>
<text x="440" y="223" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#63748b" text-anchor="middle" dominant-baseline="central">Chat 질문 / 이미지 / Trend</text>
<polyline points="440,256 440,291" fill="none" stroke="#8593a7" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,291 446.0,279.0 434.0,279.0" fill="#8593a7"/>
<rect x="70" y="300" width="740" height="130" rx="18" fill="#eaf2ff" stroke="#9dbcf4" stroke-width="1.5"/>
<text x="440" y="338" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="37" fill="#1d52a3" text-anchor="middle" dominant-baseline="central">Router LLM</text>
<text x="440" y="386" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="25" fill="#35527c" text-anchor="middle" dominant-baseline="central">질문 해석 / 검색 조건 / 필요한 Tool 결정</text>
<polyline points="440,437 440,471" fill="none" stroke="#8593a7" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,471 446.0,459.0 434.0,459.0" fill="#8593a7"/>
<rect x="70" y="480" width="740" height="140" rx="18" fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5"/>
<text x="440" y="513" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="30" fill="#223047" text-anchor="middle" dominant-baseline="central">1계층  사고 DB 우선 조회</text>
<text x="440" y="556" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" fill="#53657e" text-anchor="middle" dominant-baseline="central">사고명 / 사고번호 검색 또는 SQL 통계 집계</text>
<text x="440" y="593" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#53657e" text-anchor="middle" dominant-baseline="central">도시 / 라인 / 부서 / 제품세대 / FAB Out 불량</text>
<polyline points="440,627 440,661" fill="none" stroke="#8593a7" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,661 446.0,649.0 434.0,649.0" fill="#8593a7"/>
<rect x="70" y="670" width="740" height="200" rx="18" fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5"/>
<text x="440" y="706" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="30" fill="#223047" text-anchor="middle" dominant-baseline="central">2계층  필요한 추가 Tool 조회</text>
<text x="440" y="753" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#53657e" text-anchor="middle" dominant-baseline="central">Lot / Wafer 목록  |  사고문서 PPT / PDF</text>
<text x="440" y="793" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#53657e" text-anchor="middle" dominant-baseline="central">사내문서 / Eng’r Inform Note  |  BM25 + Vector</text>
<text x="440" y="833" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#53657e" text-anchor="middle" dominant-baseline="central">FAB / EDS 이미지  |  Trend  |  기간시스템</text>
<polyline points="440,877 440,911" fill="none" stroke="#8593a7" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,911 446.0,899.0 434.0,899.0" fill="#8593a7"/>
<rect x="70" y="920" width="740" height="130" rx="18" fill="#f0ebff" stroke="#b7a4e9" stroke-width="1.5"/>
<text x="440" y="956" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="37" fill="#673da3" text-anchor="middle" dominant-baseline="central">Judge LLM</text>
<text x="440" y="1005" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="25" fill="#665183" text-anchor="middle" dominant-baseline="central">근거 충분성 / 사고 일치 / 누락과 모순 검토</text>
<polyline points="440,1057 440,1111" fill="none" stroke="#389478" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,1111 446.0,1099.0 434.0,1099.0" fill="#389478"/>
<text x="552" y="1083" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" fill="#28775f" text-anchor="middle" dominant-baseline="central">검토 통과</text>
<rect x="70" y="1120" width="740" height="130" rx="18" fill="#e8f7f0" stroke="#91cdb7" stroke-width="1.5"/>
<text x="440" y="1156" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="37" fill="#176d53" text-anchor="middle" dominant-baseline="central">Answer LLM</text>
<text x="440" y="1205" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="26" fill="#356b5b" text-anchor="middle" dominant-baseline="central">검토된 근거로 최종 답변 작성</text>
<polyline points="440,1257 440,1291" fill="none" stroke="#8593a7" stroke-width="4" stroke-linejoin="round"/>
<polygon points="440,1291 446.0,1279.0 434.0,1279.0" fill="#8593a7"/>
<rect x="70" y="1300" width="740" height="120" rx="18" fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5"/>
<text x="440" y="1335" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="30" fill="#223047" text-anchor="middle" dominant-baseline="central">최종 결과 표시</text>
<text x="440" y="1380" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" fill="#53657e" text-anchor="middle" dominant-baseline="central">답변 / 조회 상태 / 확정된 사고 범위 / 근거</text>
<polyline points="810,985 1060,985 1060,365 816,365" fill="none" stroke="#d77a24" stroke-width="5" stroke-linejoin="round"/>
<polygon points="816,365 828.0,371.0 828.0,359.0" fill="#d77a24"/>
<rect x="865" y="515" width="260" height="176" rx="15" fill="#fff3e4" stroke="#efcda4" stroke-width="1.5"/>
<text x="995" y="554" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#965017" text-anchor="middle" dominant-baseline="central">근거 부족 / 사고 오류</text>
<text x="995" y="601" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" fill="#965017" text-anchor="middle" dominant-baseline="central">위의 동일 Router로</text>
<text x="995" y="642" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="24" fill="#965017" text-anchor="middle" dominant-baseline="central">복귀하여 재조회</text>
<text x="70" y="1465" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="21" fill="#63748b" text-anchor="start" dominant-baseline="central">추가 Tool이 불필요하면 생략. 사고 DB 선조회 조건은 실행 코드에서 검사.</text>
<text x="70" y="1504" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="20" fill="#7e899b" text-anchor="start" dominant-baseline="central">목표 설계 / 실제 LLM과 사내 시스템 통합은 아직 미구현</text>
</svg>