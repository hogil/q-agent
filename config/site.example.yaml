# config.yaml에 덮어쓸 설정입니다. 사내 비밀정보는 저장하지 않습니다.
environment: onprem
value_matching:
  enabled: true
  fields: [city, department, line, product_generations]
  max_values_per_field: 500
  max_candidates: 20
paths:
  # Replace with reviewed site resources; the launcher never creates or freezes them.
  skills_root: /appdata/qagent/site-release/skills
  dictionary_root: /appdata/qagent/site-release/domain-data
  registry_file: /appdata/qagent/site-release/skill_registry.json
  skill_lock_file: /appdata/qagent/site-release/release.lock.json
  terminology_file: /appdata/qagent/site-release/domain-data/terminology.json
  data_root: /appdata/qagent/data
  output_root: /appdata/qagent/output
  model_root: /appdata/qagent/models
  image_root: /storage/qagent/images
  document_root: /storage/qagent/documents
  trend_root: /storage/qagent/trends
  cache_root: /appdata/qagent/cache
  log_root: /appdata/qagent/logs
  golden_file: /appdata/qagent/data/reviewed-golden.jsonl
meetings:
  enabled: false
  backend: http
  endpoint: https://rag.example.internal/meeting-search
  api_key_env: QAGENT_MEETINGS_API_KEY
  top_k: 8
  max_top_k: 20
  timeout_seconds: 15
database:
  dialect: postgresql
  host: db.example.internal
  port: 5432
  name: YOUR_DATABASE_NAME
  schema: quality
  dsn_env: QAGENT_DB_DSN
arrays:
  product_generations: native_array
  fab_out_failure_codes: native_array
tables:
  incident:
    name: YOUR_INCIDENT_TABLE
    columns:
      incident_id: YOUR_INCIDENT_PK
      incident_number: YOUR_INCIDENT_NO
      title: YOUR_INCIDENT_TITLE
  lot_list:
    name: YOUR_LOT_TABLE
    columns:
      incident_ref: YOUR_INCIDENT_FK
      lot_id: YOUR_LOT_NO
  incident_document:
    name: YOUR_INCIDENT_DOCUMENT_TABLE
  wafer_list:
    name: YOUR_WAFER_LIST_TABLE
    columns:
      incident_ref: YOUR_INCIDENT_FK
      lot_id: YOUR_LOT_NO
      wafer_id: YOUR_WAFER_NO
      status: YOUR_WAFER_STATUS
  document_chunk:
    name: YOUR_CHUNK_TABLE
  image_metadata:
    name: YOUR_IMAGE_METADATA_TABLE
  trend_metadata:
    name: YOUR_TREND_METADATA_TABLE
models:
  text:
    enabled: false
    base_url: http://127.0.0.1:8000/v1
    served_model: YOUR_SERVED_MODEL_NAME
    local_dir: ${paths.model_root}/YOUR_TEXT_MODEL_DIRECTORY
    tokenizer_dir: ${paths.model_root}/YOUR_TEXT_MODEL_DIRECTORY
  image:
    local_dir: ${paths.model_root}/YOUR_IMAGE_MODEL_DIRECTORY
    checkpoint_file: YOUR_IMAGE_CHECKPOINT.pt
  trend:
    local_dir: ${paths.model_root}/YOUR_TREND_MODEL_DIRECTORY
    checkpoint_file: YOUR_TREND_CHECKPOINT.ckpt
image_tools:
  sem:
    enabled: false
    endpoint: https://sem.example.internal/v1
    served_model: YOUR_SEM_COMPARISON_MODEL
  overlay:
    enabled: false
    endpoint: https://overlay.example.internal/v1
    served_model: YOUR_OVERLAY_COMPARISON_MODEL
