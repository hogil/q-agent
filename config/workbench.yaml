# Local synthetic analysis workbench. It never selects an on-prem configuration.
config_version: 1
demo:
  base_config: config.yaml
  overlay: demo.yaml
chat:
  sqlite_file: ../var/data/workbench/conversations.sqlite
  history_limit: 40
cutoff: 2026-03-31
static_root: ../web/dist
server:
  port: 8787
sources:
  raw_file: ../data/workbench/raw.example.json
# Synthetic 300mm wafer assumption for the demo; not verified real data.
wafer_geometry:
  radius_mm: 150
  coordinate_radius: 16
  chip_pitch_x_mm: 9.375
  chip_pitch_y_mm: 9.375
  chip_origin_x_mm: 0
  chip_origin_y_mm: 0
