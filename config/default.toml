# Q-Agent 설정 v1. Python 3.11+ tomllib. 이 파일 기준 상대경로이며 실행 폴더와 무관합니다.
# 사내에서는 이 파일을 복사하지 말고 site.local.toml에 바꿀 항목만 적어 --overlay로 적용합니다.
# 논리 키(incident_id 등)는 코드 계약입니다. 오른쪽 물리 이름/경로/모델명만 교체합니다.
config_version = 1
environment = "demo"

[paths]
data_root = "../var/data"
output_root = "../var/output"
model_root = "../var/models"
image_root = "${paths.data_root}/images"
document_root = "${paths.data_root}/documents"
trend_root = "${paths.data_root}/trends"
cache_root = "../var/cache"
log_root = "../var/logs"
skills_root = "../app/skills"
dictionary_root = "../app/domain-data"
registry_file = "../app/skill_registry.json"
skill_lock_file = "../app/release.lock.json"
incident_fixture_file = "../app/data/incident_cases.json"
demo_manifest_file = "${paths.output_root}/demo_manifest.json"

[database]
dialect = "sqlite" # 현재 Adapter는 SQLite만 지원. 다른 DB는 설정 검증만 지원하며 연결 Adapter 구현 필요.
schema = "" # schema와 table을 분리. table에 schema.table 또는 SQL을 넣지 않습니다.
sqlite_file = "${paths.data_root}/quality_demo.sqlite"
dsn_env = "QAGENT_DB_DSN" # 다른 DB 연결용 환경변수 이름. DSN이나 비밀번호 실값을 적지 않습니다.
connect_timeout_seconds = 10
query_timeout_seconds = 30
read_only = true

[tables.incident]
name = "demo_incident"
[tables.incident.columns]
incident_id = "accident_pk"
incident_number = "accident_no"
title = "accident_title"
city = "city_name"
line = "line_name" # 표시용. 코드와 별칭은 다음 두 컬럼.
line_code = "line_code"
line_alias = "line_alias"
department = "department_code"
occurred_at = "occurred_at"
product_generations = "product_generations"
fab_out_failure_codes = "fab_out_failure_codes"
expected_lot_count = "registered_lot_count"
affected_wafer_count = "affected_wafer_count"
incident_detail = "incident_detail"
analysis_detail = "analysis_detail"
confirmed_cause = "confirmed_cause"
containment = "containment"
corrective_action = "corrective_action"
verification = "verification"
prevention = "prevention"
remaining = "remaining"

[tables.lot_list]
name = "demo_lot_list"
[tables.lot_list.columns]
incident_ref = "accident_ref"
lot_id = "lot_no"
product_code = "product_name"
status = "lot_state"

[tables.incident_document]
name = "demo_incident_document"
[tables.incident_document.columns]
document_id = "document_id"
incident_ref = "accident_ref"
title = "document_title"
version = "document_version"
storage_ref = "storage_ref"
format = "document_format"
source = "source_name"

[tables.document_chunk]
name = "demo_document_chunk"
[tables.document_chunk.columns]
chunk_id = "chunk_id"
document_ref = "document_ref"
location = "page_or_slide"
content = "chunk_text"

[tables.image_metadata]
name = "demo_image_metadata"
[tables.image_metadata.columns]
image_id = "image_id"
incident_ref = "accident_ref"
lot_id = "lot_no"
wafer_id = "wafer_no"
stage = "test_stage"
storage_ref = "storage_ref"
coordinate_system = "coordinate_system"

[tables.trend_metadata]
name = "demo_trend_metadata"
[tables.trend_metadata.columns]
trend_id = "trend_id"
incident_ref = "accident_ref"
metric = "metric_name"
unit = "metric_unit"
storage_ref = "storage_ref"
timezone = "timezone"

[relations]
incident_parent_key = "incident_id" # incident_number로 교체 가능. 실제 FK 의미 확인 필수.
lot_incident_key = "incident_ref"
document_incident_key = "incident_ref"
image_incident_key = "incident_ref"
trend_incident_key = "incident_ref"
chunk_document_key = "document_ref"
source_completeness = "unknown" # 사내에서는 ETL 보장 확인 후에만 declared_complete.

[arrays]
product_generations = "json_text" # SQLite 더미. 사내 native_array/json_array 여부 설정.
fab_out_failure_codes = "json_text"

[storage]
backend = "local" # object는 계약만 제공, Adapter 미구현.
endpoint = ""
bucket = ""
prefix = "quality/"
credential_env = "QAGENT_STORAGE_CREDENTIAL"
signed_url_ttl_seconds = 300

# 모델 폴더명/파일명과 API model 값은 다른 개념입니다.
# API 모드는 이미 실행 중인 서버를 호출할 설정입니다. 이 코드가 모델 서버를 시작하지 않습니다.
[models.text]
enabled = false
mode = "api"
base_url = "http://127.0.0.1:8000/v1"
api_key_env = "QAGENT_LLM_API_KEY"
served_model = "SET_SERVED_MODEL_NAME"
local_dir = "${paths.model_root}/text-model"
checkpoint_file = "" # 디렉터리형 모델은 빈 문자열. 단일 GGUF 등은 파일명 기입.
tokenizer_dir = "${paths.model_root}/text-model"
timeout_seconds = 120

[models.image]
enabled = false
mode = "local"
base_url = ""
api_key_env = "QAGENT_IMAGE_API_KEY"
served_model = ""
local_dir = "${paths.model_root}/image-model"
checkpoint_file = "failure_model.pt"
tokenizer_dir = ""
timeout_seconds = 60

[models.trend]
enabled = false
mode = "local"
base_url = ""
api_key_env = "QAGENT_TREND_API_KEY"
served_model = ""
local_dir = "${paths.model_root}/trend-model"
checkpoint_file = "trend_model.ckpt"
tokenizer_dir = ""
timeout_seconds = 60

[roles.router]
model = "text"
temperature = 0.0
max_output_tokens = 1200
[roles.answer]
model = "text"
temperature = 0.0
max_output_tokens = 3000
[roles.judge]
model = "text"
temperature = 0.0
max_output_tokens = 1200

# 기존 chunk와 BM25/vector 검색 계약. 재chunking이나 인덱스 재생성을 하지 않습니다.
[retrieval.internal_documents]
enabled = false
endpoint = ""
api_key_env = "QAGENT_INTERNAL_RAG_KEY"
index_name = "SET_EXISTING_INDEX"
existing_chunks = true
methods = ["bm25", "vector_similarity"]
fusion = "source_managed"
reranker = "source_managed"
top_k = 10
timeout_seconds = 30
[retrieval.engineer_notes]
enabled = false
endpoint = ""
api_key_env = "QAGENT_ENGINEER_RAG_KEY"
index_name = "SET_EXISTING_INDEX"
existing_chunks = true
methods = ["bm25", "vector_similarity"]
fusion = "source_managed"
reranker = "source_managed"
top_k = 10
timeout_seconds = 30

[enterprise]
enabled = false
endpoint = ""
api_key_env = "QAGENT_ENTERPRISE_KEY"
timeout_seconds = 30
[actions]
enabled = false
endpoint = ""
api_key_env = "QAGENT_ACTION_KEY"
timeout_seconds = 30
require_approval = true

[runtime]
timezone = "Asia/Seoul"
default_page_size = 20
max_page_size = 100
max_scope_incidents = 100
scope_ttl_seconds = 1800
max_tool_calls = 12
max_parallel_tools = 3
max_retries = 2
max_answer_revisions = 2

[demo]
incident_count = 24
lots_per_incident = 4
trend_points = 48
seed = 20260913
