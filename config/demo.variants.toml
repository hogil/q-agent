# 합성 오타/동의어 다중 컬럼 검색 전용. 기존 더미 DB와 다른 경로.
environment = "demo"
[paths]
data_root = "../var/variants-128/data"
output_root = "../var/variants-128/output"
incident_fixture_file = "../app/data/variant_incident_templates.json"
[tables.incident]
name = "synthetic_quality_incidents"
[tables.incident.columns]
department = "owner_department"
product_generations = "generation_array"
fab_out_failure_codes = "fab_out_codes"
[tables.lot_list]
name = "synthetic_quality_lots"
[tables.wafer_list]
name = "synthetic_quality_wafers"
[runtime]
default_page_size = 7
max_scope_incidents = 200
[demo]
incident_count = 128
lots_per_incident = 5
wafers_per_lot = 12
trend_points = 48
seed = 20260916
