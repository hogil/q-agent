# 더 큰 두 번째 합성 데이터 세트. default 세트와 파일이 겹치지 않습니다.
environment = "demo"
[paths]
data_root = "../var/batch-100/data"
output_root = "../var/batch-100/output"
[database]
sqlite_file = "${paths.data_root}/renamed_quality.sqlite"
[tables.incident]
name = "batch_incidents"
[tables.incident.columns]
incident_id = "case_pk"
incident_number = "case_number"
title = "case_title"
[tables.lot_list]
name = "batch_lots"
[tables.incident_document]
name = "batch_documents"
[tables.document_chunk]
name = "batch_chunks"
[tables.image_metadata]
name = "batch_images"
[tables.trend_metadata]
name = "batch_trends"
[runtime]
default_page_size = 2
[demo]
incident_count = 100
lots_per_incident = 4
trend_points = 72
seed = 20260914
