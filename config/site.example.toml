# default.toml에 덮어쓸 항목만 작성합니다. 이 파일은 접속 가능한 사내 설정이 아닙니다.
# cp config/site.example.toml config/site.local.toml
# python app/config_loader.py --overlay config/site.local.toml
environment = "onprem"

[paths]
data_root = "/appdata/qagent/data"
output_root = "/appdata/qagent/output"
model_root = "/appdata/qagent/models"
image_root = "/storage/qagent/images"
document_root = "/storage/qagent/documents"
trend_root = "/storage/qagent/trends"
cache_root = "/appdata/qagent/cache"
log_root = "/appdata/qagent/logs"
# skills_root = "/appdata/qagent/releases/current/skills"
# registry_file = "/appdata/qagent/releases/current/skill_registry.json"
# skill_lock_file = "/appdata/qagent/releases/current/release.lock.json"
# dictionary_root = "/appdata/qagent/releases/current/domain-data"

[database]
dialect = "postgresql" # 이 값만 변경하면 SQLite Adapter가 PostgreSQL로 바뀌는 것은 아닙니다.
schema = "quality"
dsn_env = "QAGENT_DB_DSN"

[arrays]
product_generations = "native_array"
fab_out_failure_codes = "native_array"

[tables.incident]
name = "YOUR_INCIDENT_TABLE"
[tables.incident.columns]
incident_id = "YOUR_INCIDENT_PK"
incident_number = "YOUR_INCIDENT_NO"
title = "YOUR_INCIDENT_TITLE"
# 나머지 컬럼도 default.toml의 논리 키를 기준으로 실제 이름을 입력하세요.
[tables.lot_list]
name = "YOUR_LOT_TABLE"
[tables.lot_list.columns]
incident_ref = "YOUR_INCIDENT_FK"
lot_id = "YOUR_LOT_NO"
[tables.incident_document]
name = "YOUR_INCIDENT_DOCUMENT_TABLE"
[tables.wafer_list]
name = "YOUR_WAFER_LIST_TABLE"
[tables.wafer_list.columns]
incident_ref = "YOUR_INCIDENT_FK"
lot_id = "YOUR_LOT_NO"
wafer_id = "YOUR_WAFER_NO"
status = "YOUR_WAFER_STATUS"
[tables.document_chunk]
name = "YOUR_CHUNK_TABLE"
[tables.image_metadata]
name = "YOUR_IMAGE_METADATA_TABLE"
[tables.trend_metadata]
name = "YOUR_TREND_METADATA_TABLE"

[models.text]
enabled = false # 실제 모델 API 확인 후 true
base_url = "http://127.0.0.1:8000/v1"
served_model = "YOUR_SERVED_MODEL_NAME"
local_dir = "${paths.model_root}/YOUR_TEXT_MODEL_DIRECTORY"
tokenizer_dir = "${paths.model_root}/YOUR_TEXT_MODEL_DIRECTORY"
[models.image]
local_dir = "${paths.model_root}/YOUR_IMAGE_MODEL_DIRECTORY"
checkpoint_file = "YOUR_IMAGE_CHECKPOINT.pt"
[models.trend]
local_dir = "${paths.model_root}/YOUR_TREND_MODEL_DIRECTORY"
checkpoint_file = "YOUR_TREND_CHECKPOINT.ckpt"

# 서로 다른 모델을 사용할 경우 [models.text]와 동일한 구조로 [models.fast]를 추가하고
# [roles.router] model = "fast"를 지정할 수 있습니다.
