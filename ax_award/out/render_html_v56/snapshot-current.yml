        - row [ref=e132]:
          - rowheader "기술적 해결 방안" [ref=e133]: 기술적해결 방안
          - cell "이 문제는 질문마다 필요한 데이터와 조사 순서가 달라, 고정 규칙이나 단일 검색으로 끝낼 수 없습니다. 왜 Agent인가 사건마다 설비, 기간, 이미지, 과거 조치의 조합이 다르다. 조사 중 얻은 결과에 따라 다음 조회를 골라야 한다. 무엇을 고정하는가 판단 절차는 도구 호출, 근거 인용, 검증기, 승인 경계로 고정한다. 언어 모델은 도구 선택과 근거 종합에만 쓴다. 대안 업무 한계 Q-Agent 선택 사내 공용 RAG 설비 ID 토큰 보호, 메타 필터, 검색 지표 운영을 요구대로 다루기 어렵다. 도메인 색인과 회귀 측정을 분리 운영 BI, 대시보드 사람이 봐야 할 화면만 늘리고, 조사 순서를 정하지 못한다. 도구 호출 뒤 판단안 반환 규칙 기반 SPC 이상 신호는 주지만 원인과 조치안을 만들지 못한다. 이상 신호를 Adapter 입력으로 사용 알고리즘 선택 Agent orchestration ReAct 도구 루프로 필요한 조회를 반복 Hybrid retrieval 벡터와 키워드로 과거 Inform Note 후보 검색 Reranking 사건 조건과 가까운 근거를 위로 정렬 Grounding verifier 숫자, 인용, 조치 권한을 별도 검증 Q-Agent 회귀 러너 실측 recall@10 0.500 골든 4건, 색인 50건 현재 수치는 검색 회수율 하나만 적는다. 판정 일치율은 2Q 그림자 운영에서 기준선을 실측한 뒤 회귀 게이트로 고정한다. 개선 과정 골든 시나리오와 실패 사례 수집 → 질의 재작성, 검색기, 리랭커 변경 → recall@10 재측정 → 검증기와 회귀 러너 통과 뒤 배포 프롬프트, 모델, 임베딩, 색인을 바꿀 때마다 회귀 러너를 실행한다. 근거 없는 판단과 미승인 조치는 배포 단계에서 막는다." [ref=e134]:
