          - cell "사람이 하던 조사 업무를 줄이는 것이 아니라, 사건 접수부터 결과 등록까지 한 흐름으로 재구성합니다. Human 이상 확인 → 화면별 조회 → 원인 토의 → 승인 → 결과 기록 Q-Agent 이벤트 또는 질문 입력 → 근거 조사 → 판단안 → 권한별 조치 → Inform Note 등록 Adapter 이상을 질문으로 → Investigator 도구 반복 조회 → Judgment 근거 판정 → Action 권한별 조치 → Answer 사람에게 반환 → Register 확정 결과 등록 코어 하나, 입구 둘 Chat은 엔지니어 질문으로 시작한다. Adapter는 SPC 알람을 조사 질문으로 바꾼다. 두 입구는 같은 조사 코어와 도구를 쓴다. 도구는 결과만 반환 SQL 조회, 공통성 분석, wafer map, 이미지 판독, 유사 사례 검색은 정해진 함수가 수행한다. 판단은 인용 가능한 반환값에만 기대게 한다. 조치 승인 경계 L0 조회와 요약 L1 알림과 티켓 제안 L2 사람 승인 뒤 조치 L3 저위험 항목만 개별 심의 뒤 자동 사람의 판정 승인, 수정, 반려 → Register 조사규칙과 Inform Note로 등록 → 다음 조사에서 유사 사례로 재사용. 미승인 L2 조치는 감사 로그에서 0건으로 관리한다. 확산 계획 1Q 조사 코어, 도구, 검증기 → 2Q Shadow 운영, 조치 미실행 → 3Q Chat 파일럿 확대 → 4Q 무인 접수, 누락 0건 → 2차년 etch, CMP 확산 5Q는 etch 골든셋 회귀 통과와 코어 변경 0을 확인한다. 공정별로 조사규칙과 시스템 지도만 추가해 확산 비용을 낮춘다." [ref=e80]:
